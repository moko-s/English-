<html lang="ja"><head><meta charset="utf-8"><title>English Trainer</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3b6cf6"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--sub:#667085;--ac:#3b6cf6;--ok:#16a34a;--ng:#dc2626;--bd:#e4e7ee}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--sub:#9aa3b5;--ac:#6b93ff;--bd:#2c3342}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 12px}.sub{color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5}
.mode{text-align:left;padding:14px}.mode b{display:block;font-size:17px}
.en{font-size:22px;font-weight:600;line-height:1.4}.ja{color:var(--ok);margin-top:8px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.stats{display:flex;gap:8px;margin-top:10px}.stats div{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}.stats b{font-size:20px;display:block}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin-top:8px}.opt.ok{background:var(--ok);color:#fff}.opt.ng{background:var(--ng);color:#fff}
.w-ok{color:var(--ok)}.w-ng{color:var(--ng);text-decoration:underline}
.bub{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:85%}.ai{background:var(--card);border:1px solid var(--bd)}.me{background:var(--ac);color:#fff;margin-left:auto}
.fix{font-size:13px;color:var(--sub);border-left:3px solid var(--ng);padding-left:8px;margin:-2px 0 8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;display:none;z-index:9}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
</style></head><body><div id="app"></div><div id="toast"></div>

["I have been studying English for a month.","私は1か月間英語を勉強しています。",3],["If it rains, we will stay home.","雨が降ったら、私たちは家にいます。",3],["I'd like to visit Mexico someday.","いつかメキシコを訪れてみたいです。",3],["Could you tell me how to get to the airport?","空港への行き方を教えていただけますか?",3],["The movie was more interesting than I expected.","その映画は思ったより面白かったです。",3],["I forgot to bring my umbrella.","傘を持ってくるのを忘れました。",3],["I like apples.","りんごが好きです。",1],["He is my friend.","彼は私の友達です。",1],["My mother cooks dinner.","母は夕食を作ります。",1],["I wake up at seven.","私は7時に起きます。",1],["The dog is very big.","その犬はとても大きいです。",1],["Please open the door.","ドアを開けてください。",1],["I have two sisters.","私には姉妹が2人います。",1],["It is cold today.","今日は寒いです。",1],["She reads a book every day.","彼女は毎日本を読みます。",1],["Do you speak English?","あなたは英語を話しますか?",1],["I usually eat breakfast at home.","私はたいてい家で朝食を食べます。",2],["My brother is taller than me.","兄は私より背が高いです。",2],["Let's meet at the station at noon.","正午に駅で会いましょう。",2],["I am looking for a post office.","郵便局を探しています。",2],["She was very tired after work.","彼女は仕事のあとでとても疲れていました。",2],["We should leave before it gets dark.","暗くなる前に出発すべきです。",2],["This soup is too hot to drink.","このスープは熱すぎて飲めません。",2],["I can't find my phone.","携帯電話が見つかりません。",2],["He asked me to open the window.","彼は私に窓を開けるよう頼みました。",2],["The train leaves at six thirty.","電車は6時30分に出ます。",2],["I have never been to Canada, but I want to go.","カナダには行ったことがないけれど、行ってみたいです。",3],["She told me that she was moving to Osaka.","彼女は大阪に引っ越すと私に言いました。",3],["Could you speak a little more slowly?","もう少しゆっくり話していただけますか?",3],["I'm not sure whether he will come.","彼が来るかどうか分かりません。",3],["The restaurant was so crowded that we waited an hour.","そのレストランは混んでいて、1時間待ちました。",3],["I used to play the piano when I was a child.","子どものころピアノを弾いていました。",3],["Please let me know if you need any help.","助けが必要なら知らせてください。",3],["It takes about twenty minutes to walk there.","そこまで歩いて約20分かかります。",3],["My favorite season is spring because it is warm.","好きな季節は、暖かいので春です。",3],["He decided to study abroad next year.","彼は来年留学することにしました。",3],["I'm thinking about changing my job next year.","来年転職しようか考えています。",4],["The meeting was postponed because the manager was sick.","会議は部長が病気だったため延期されました。",4],["I'll call you as soon as I arrive at the hotel.","ホテルに着いたらすぐ電話します。",4],["You don't have to pay if you bring a coupon.","クーポンを持ってくれば払う必要はありません。",4],["Do you mind if I open the window?","窓を開けてもいいですか?",4],["She has lived in Tokyo since she was a child.","彼女は子どものころから東京に住んでいます。",4],["I was surprised to hear that he had quit his job.","彼が仕事を辞めたと聞いて驚きました。",4],["Traffic was so heavy that I missed my flight.","渋滞がひどくて飛行機に乗り遅れました。",4],["If I had more free time, I would travel around the world.","もっと自由な時間があれば、世界中を旅行するのに。",5],["The price of vegetables has gone up since last month.","野菜の値段は先月から上がっています。",5],["I'm looking forward to seeing you again next week.","来週またお会いできるのを楽しみにしています。",5],["Although it was raining, they decided to go hiking.","雨だったけれど、彼らはハイキングに行くことにしました。",5],["She asked whether I could recommend a good dentist.","彼女は、良い歯医者を勧めてくれないかと尋ねました。",5],["The new policy is expected to reduce traffic in the city.","新しい政策は市内の渋滞を減らすと見込まれています。",5],["I wish I had studied harder when I was a student.","学生のころ、もっと一生懸命勉強していればよかったです。",5],["Despite the heavy rain, the concert was a great success.","大雨にもかかわらず、コンサートは大成功でした。",5]];

const SC=[{n:"カフェで注文",a:"a café clerk",b:"a customer",s:"ordering coffee at a café"},{n:"道を聞く",a:"a passerby",b:"a tourist who is lost",s:"asking the way to the station"},{n:"自己紹介",a:"a new friend",b:"a person who meets them for the first time",s:"first meeting, talking about hobbies and food"},{n:"ホテルのチェックイン",a:"a hotel receptionist",b:"a guest",s:"checking in to a hotel"}];

const DICT={student:"学生",likes:"好きだ(like)",cats:"猫",time:"時間",bus:"バス",station:"駅",book:"本",where:"どこ",what:"何",want:"欲しい・したい",drink:"飲む",playing:"している(play)",soccer:"サッカー",now:"今",help:"助ける",yesterday:"昨日",went:"行った(go)",park:"公園",tomorrow:"明日",sunny:"晴れた",bag:"かばん",much:"どれくらい",studying:"勉強している(study)",english:"英語",month:"月",rains:"雨が降る(rain)",stay:"とどまる",home:"家",visit:"訪れる",someday:"いつか",mexico:"メキシコ",tell:"教える",airport:"空港",movie:"映画",interesting:"面白い",expected:"予想した(expect)",forgot:"忘れた(forget)",bring:"持ってくる",umbrella:"傘",play:"遊ぶ・する",go:"行く",gets:"〜になる(get)",more:"もっと",than:"〜より",about:"約・〜について",there:"そこに",thinking:"考えている(think)",changing:"変える(change)",job:"仕事",meeting:"会議",postponed:"延期された",manager:"部長・責任者",sick:"病気の",call:"電話する",soon:"すぐに",arrive:"到着する",hotel:"ホテル",pay:"払う",coupon:"クーポン",mind:"気にする",lived:"住んでいる(live)",tokyo:"東京",since:"〜から",surprised:"驚いた",hear:"聞く",quit:"辞めた",traffic:"渋滞",heavy:"ひどい・重い",missed:"逃した(miss)",flight:"飛行機の便",free:"自由な",would:"〜するだろう",around:"〜の周りを",world:"世界",price:"値段",vegetables:"野菜",gone:"上がった(go)",last:"先の",forward:"前へ",seeing:"会う(see)",again:"再び",week:"週",although:"〜だけれども",raining:"雨が降っている(rain)",hiking:"ハイキング",dentist:"歯医者",good:"良い",policy:"政策",reduce:"減らす",city:"市",wish:"〜であればいいのに",harder:"より一生懸命に",studied:"勉強した(study)",despite:"〜にもかかわらず",concert:"コンサート",success:"成功",great:"すばらしい",rain:"雨",like:"好きだ",apples:"りんご",mother:"母",cooks:"料理する(cook)",dinner:"夕食",wake:"目が覚める(wake up)",seven:"7",dog:"犬",very:"とても",open:"開ける",door:"ドア",two:"2",sisters:"姉妹",cold:"寒い",today:"今日",reads:"読む(read)",every:"毎〜",day:"日",speak:"話す",usually:"たいてい",breakfast:"朝食",brother:"兄・弟",taller:"より背が高い(tall)",meet:"会う",noon:"正午",looking:"探している(look for)",post:"郵便",office:"事務所",work:"仕事",after:"〜のあとで",leave:"出発する",dark:"暗い",before:"〜の前に",should:"〜すべき",soup:"スープ",hot:"熱い",too:"〜すぎる",find:"見つける",phone:"電話",asked:"頼んだ(ask)",window:"窓",train:"電車",leaves:"出発する(leave)",six:"6",thirty:"30",never:"一度もない",canada:"カナダ",but:"しかし",been:"行ったことがある(be)",told:"言った(tell)",moving:"引っ越す(move)",osaka:"大阪",slowly:"ゆっくり",little:"少し",sure:"確か",whether:"〜かどうか",come:"来る",restaurant:"レストラン",crowded:"混んでいる",waited:"待った(wait)",hour:"1時間",used:"〜したものだ(used to)",piano:"ピアノ",child:"子ども",know:"知る",need:"必要とする",takes:"かかる(take)",twenty:"20",minutes:"分",walk:"歩く",favorite:"お気に入りの",season:"季節",spring:"春",because:"なぜなら",warm:"暖かい",decided:"決めた(decide)",study:"勉強する",abroad:"海外で",next:"次の",year:"年"};
const ALL=[...WORDS,...Object.entries(DICT).filter(([k])=>!WORDS.some(w=>w[0]==k)).map(([k,v])=>[k,v,9])];
const DAYS=[0,1,3,7,14],$=s=>document.querySelector(s),app=$("#app");
const K=["listening","reading","speaking","conv","vocab"],KN={reading:"Reading",listening:"Listening",speaking:"Speaking",conv:"Conversation",vocab:"Vocabulary"};let S={sk:{},d:{k:"",n:0},w:{}};K.forEach(k=>S.sk[k]={lv:1,h:[],t:0,c:0});
try{Object.assign(S,JSON.parse(localStorage.getItem("et2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("et2",JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function rec(k,ok){const s=S.sk[k];s.t++;if(ok)s.c++;if(S.d.k!=today())S.d={k:today(),n:0};S.d.n++;s.h.push(ok?1:0);s.h=s.h.slice(-10);
 if(s.h.length>=10){const a=s.h.reduce((x,y)=>x+y,0)/10;
  if(a>=.9&&s.lv<5){s.lv++;s.h=[];toast("🎉 "+KN[k]+" がLv."+s.lv+"に!")}else if(a<=.4&&s.lv>1){s.lv--;s.h=[];toast(KN[k]+" をLv."+s.lv+"で復習しましょう")}}save()}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pick=k=>{const L=S.sk[k].lv,cur=SENT.filter(s=>s[2]==L),low=SENT.filter(s=>s[2]<=L);return rnd(Math.random()<.7?cur:low)};
function speak(t,cb,r){if(!window.speechSynthesis)return toast("音声再生に未対応です");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r||.85;if(cb)u.onend=cb;speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(cb){if(!SR){toast("このブラウザは音声認識に未対応です(Chrome/Safari推奨)");return}const r=new SR();r.lang="en-US";r.interimResults=false;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>toast("マイクを使えませんでした: "+e.error);r.start();return r}
const hd=(t,k)=>`<div class="row" style="margin:0 0 12px"><button id="back" style="flex:0 0 auto">← ホーム</button><b style="flex:1;align-self:center">${t} <span class="sub">Lv.${S.sk[k].lv}</span></b></div>`;
const bind=()=>{const b=$("#back");if(b)b.onclick=()=>{speechSynthesis&&speechSynthesis.cancel();home()}};
function due(){const n=Date.now();return ALL.filter(w=>S.w[w[0]]&&S.w[w[0]].due<=n&&(w[2]<=S.sk.vocab.lv||S.w[w[0]].m))}
function home(){const n=S.d.k==today()?S.d.n:0,m=Object.values(S.w).filter(x=>x.b>=4).length,I={reading:["📖","文字を見て意味をとる(音なし)"],listening:["👂","耳だけで聞き取る(まずはここから)"],speaking:["🎤","音を正確に出す"],conv:["💬","4技能を統合して会話"],vocab:["🗂","語彙を定着させる(Leitner)"]};
 app.innerHTML=`<h1>🎧 English Trainer</h1><div class="card"><b>今日 ${n} 問</b><span class="sub"> ・ 復習待ち単語 ${due().length} ・ 習得単語 ${m}</span><div class="sub" style="margin-top:2px">技能ごとに別々にレベルUP(10問中9問正解で+1)</div></div>`+K.map(k=>{const s=S.sk[k],a=s.t?Math.round(s.c/s.t*100):0;return`<button class="mode card" data-m="${k}" style="width:100%;display:block;margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${I[k][0]} ${KN[k]}</b><span class="sub">Lv.${s.lv} ・ 正答 ${a}%</span></div><div class="sub">${I[k][1]}</div><div class="bar"><i style="width:${s.h.length*10}%"></i></div></button>`}).join("");

 $(".card").onclick=e=>{$("#ja").style.display="block";$("#hint").style.display="none";$("#ans").style.display="flex"};
 $("#y").onclick=()=>{rec("reading",1);reading()};$("#n").onclick=()=>{rec("reading",0);reading()}}
function listening(){const s=pick("listening"),ch=shuf([s,...shuf(SENT.filter(x=>x!==s)).slice(0,3)]);
 app.innerHTML=hd("Listening","listening")+`<div class="card" style="text-align:center"><div class="sub">耳だけで聞いて、意味を選んでください(文字は答えるまで非表示)</div><div class="row"><button class="p" id="sp" style="font-size:18px">🔊 再生</button><button id="sl">🐢 ゆっくり</button></div></div><div id="o">${ch.map((c,i)=>`<button class="opt" data-i="${i}">${c[1]}</button>`).join("")}</div><div id="r"></div>`;bind();

  $("#r").innerHTML=`<div class="card" style="margin-top:12px"><div class="en">${s[0]}</div><div class="ja" style="font-size:15px">${s[1]}</div>${ms.length?`<div class="sub" style="margin-top:8px">📝 単語練習に追加: ${ms.map(w=>w[0]+"("+w[1]+")").join("、")}</div>`:""}<div class="row"><button class="p" id="nx">次へ</button></div></div>`;$("#nx").onclick=listening})}

function speaking(){const s=pick("speaking");app.innerHTML=hd("Speaking","speaking")+`<div class="card"><div class="en">${s[0]}</div><div class="sub">お手本を聞いて、同じ音で真似しましょう</div><div class="row"><button id="sp">🔊 お手本</button><button id="sl">🐢 ゆっくり</button><button class="p" id="mic">🎤 話す</button></div></div><div id="r"></div>`;bind();

 $("#mic").onclick=()=>{$("#mic").textContent="聞いています…";const r=listen(t=>{const h=nw(t),pool=[...h],tg=nw(s[0]);let hit=0;const marks=tg.map(w=>{const i=pool.indexOf(w);if(i>=0){pool.splice(i,1);hit++;return`<span class="w-ok" data-w="${w}">${w}</span>`}return`<span class="w-ng" data-w="${w}">${w}</span>`});
  const sc=Math.round(hit/tg.length*100),ok=sc>=70;rec("speaking",ok);
  $("#r").innerHTML=`<div class="card"><div style="font-size:34px;font-weight:700;color:var(--${ok?"ok":"ng"})">${sc}点</div><div class="en" style="font-size:18px">${marks.join(" ")}</div><div class="sub" style="margin-top:8px">認識結果: ${t}</div><div class="sub">赤い単語は聞き取れなかった部分。単語をタップするとお手本が聞けます</div><div class="row"><button id="rt">もう一度</button><button class="p" id="nx">次へ</button></div></div>`;document.querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>speak(x.dataset.w,0,.6));$("#nx").onclick=speaking;
  $("#rt").onclick=()=>{$("#r").innerHTML="";$("#mic").textContent="🎤 話す"};$("#mic").textContent="🎤 話す"});if(!r)$("#mic").textContent="🎤 話す"}}
async function conv(){app.innerHTML=hd("Conversation")+`<div class="grid">${SC.map((c,i)=>`<button class="mode" data-i="${i}"><b>${c.n}</b></button>`).join("")}</div>`;bind();
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>chat(SC[b.dataset.i],0))}
async function chat(sc,ai){const me=ai?sc.a:sc.b,aiR=ai?sc.b:sc.a;let msgs=[],busy=false;const lvn=["very easy (A1)","easy (A1-A2)","simple (A2)","intermediate (B1)","upper-intermediate (B1-B2)"][S.sk.conv.lv-1];
 const SYS=`Role-play for English practice. You are ${aiR}. The learner is ${me}. Scene: ${sc.s}. Learner: Japanese adult at junior-high English level, target ${lvn}. Use short simple sentences (under 12 words), one turn at a time, and ask easy questions to keep going. Reply ONLY with your line. If the learner's last message has a clear English mistake, add a new line starting with "訂正:" giving the corrected sentence and a very short Japanese note.`;
 app.innerHTML=hd(sc.n,"conv")+`<div class="sub">あなた: ${me} / AI: ${aiR}</div><div id="log"></div><div class="row"><button class="p" id="mic">🎤 話す</button><button id="sw" style="flex:0 0 auto">役割交代</button></div><div class="row"><input id="tx" placeholder="マイクが使えない時はここに入力"><button id="go" style="flex:0 0 auto">送信</button></div>`;bind();
 $("#sw").onclick=()=>chat(sc,ai?0:1);
 const draw=()=>{$("#log").innerHTML=msgs.map((m,i)=>{if(m.r=="me")return`<div class="bub me">${m.t}</div>`;const[a,...f]=m.t.split(/\n?訂正:/);return`<div class="bub ai" data-i="${i}">${m.v?a.trim():"🔊 タップで文字を表示"}</div>`+(f.length?`<div class="fix">訂正: ${f.join("").trim()}</div>`:"")}).join("")};
 $("#log").onclick=e=>{const b=e.target.closest(".ai");if(!b)return;const m=msgs[b.dataset.i];m.v=1;draw();speak(m.t.split(/\n?訂正:/)[0].trim())};
 const sample=sampleFn;if(!sample){$("#log").innerHTML='<div class="card">この環境ではAI会話を利用できません(Claudeのアーティファクトとして開いてください)。</div>';return}
 const ask=async()=>{busy=true;$("#log").insertAdjacentHTML("beforeend",'<div class="sub" id="th">…</div>');let turns=[{role:"user",content:SYS+" Begin."}];
  msgs.forEach(m=>{const r=m.r=="me"?"user":"assistant",l=turns[turns.length-1];if(l.role==r)l.content+="\n"+m.t;else turns.push({role:r,content:m.t})});
  try{const o=await sample(turns);msgs.push({r:"ai",t:o.text.trim()});if(msgs.length>1)rec("conv",!/訂正:/.test(o.text));draw();speak(o.text.split(/\n?訂正:/)[0].trim())}catch(e){toast("AIが応答できませんでした")}busy=false;const th=$("#th");if(th)th.remove()};
 const send=t=>{if(!t||busy)return;msgs.push({r:"me",t});draw();ask()};
 $("#mic").onclick=()=>{$("#mic").textContent="聞いています…";listen(t=>{$("#mic").textContent="🎤 話す";send(t)})||($("#mic").textContent="🎤 話す")};
 $("#go").onclick=()=>{const v=$("#tx").value.trim();$("#tx").value="";send(v)};
 if(!ai)ask()}
function vocab(){const d=due(),nw2=WORDS.filter(w=>w[2]<=S.sk.vocab.lv&&!S.w[w[0]]);const dm=d.filter(x=>S.w[x[0]].m);let w=d.length?rnd(dm.length?dm:d):nw2[0];
 if(!w){const nx=Object.values(S.w).map(x=>x.due).sort((a,b)=>a-b)[0];app.innerHTML=hd("Vocabulary","vocab")+`<div class="card">🎉 今日の復習は完了です!<div class="sub">次の復習: ${nx?new Date(nx).toLocaleDateString("ja-JP"):"-"}</div></div>`;bind();return}
 const st=S.w[w[0]]||{b:1};app.innerHTML=hd("Vocabulary","vocab")+`<div class="card" style="text-align:center"><div class="sub">${S.w[w[0]]?(S.w[w[0]].m?"🎧 聞き取りで間違えた単語":"復習"):"新しい単語"} · ボックス ${st.b}/5(残り ${d.length+nw2.length-(S.w[w[0]]?0:1)} 語)</div><div class="en" style="font-size:32px;margin:10px 0">${w[0]}</div><button id="sp">🔊</button><div class="ja" id="ja" style="display:none;font-size:22px">${w[1]}</div></div><div class="row"><button class="p" id="sh">答えを見る</button></div><div class="row" id="ans" style="display:none"><button id="n">まだ</button><button class="p" id="y">覚えてた</button></div>`;bind();
 $("#sp").onclick=()=>speak(w[0]);if(S.w[w[0]]&&S.w[w[0]].m)speak(w[0]);$("#sh").onclick=()=>{$("#ja").style.display="block";$("#sh").style.display="none";$("#ans").style.display="flex"};
 const set=ok=>{const b=ok?Math.min(5,st.b+(S.w[w[0]]?1:2)):1;S.w[w[0]]={b,due:Date.now()+DAYS[b-1]*864e5,m:ok?0:(st.m||0)};if(b==1)S.w[w[0]].due=Date.now()+6e5;rec("vocab",ok);vocab()};
 $("#y").onclick=()=>set(1);$("#n").onclick=()=>set(0)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
